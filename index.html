<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17221d">
  <title>UNDERROOT — A little room to grow</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body style="margin:0;min-height:100vh;background:#111a16;color:#d9d0aa;display:grid;place-items:center">
  <main id="shell">
    <canvas id="game" width="384" height="256" tabindex="0" aria-label="UNDERROOT top-down exploration game"></canvas>
    <div class="touch-controls" aria-label="Touch controls">
      <button id="move-stick" class="move-stick" type="button" aria-label="Movement joystick">
        <span class="move-stick__ring"><span class="move-stick__knob"></span></span>
      </button>
      <button id="touch-pause" class="touch-pause" type="button" aria-label="Pause" aria-pressed="false" hidden><span>Ⅱ</span></button>
      <button id="touch-interact" class="touch-interact" type="button" aria-label="Interact" hidden>
        <span class="touch-interact__glyph" aria-hidden="true">✧</span>
        <span class="touch-interact__copy"><strong id="touch-interact-name">INTERACT</strong><small>INSPECT</small></span>
      </button>
    </div>
    <footer class="controls" aria-label="Game controls">
      <span class="controls__title">FIELD NOTES</span>
      <span><kbd>E</kbd> / click inspect</span>
      <span><kbd>ESC</kbd> pause</span>
    </footer>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
